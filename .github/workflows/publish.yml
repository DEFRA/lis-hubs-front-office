name: 'Publish Container Image'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    uses: DEFRA/lis-github-actions/.github/workflows/node-service-publish.yml@aafa6fb5ff10bb9dab399cc4992145c3bd109d82
    secrets: inherit
